[package]
name = "spg-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Anas Naciri <12anas2000@gmail.com>"]
description = "A CLI for initializing Spring Boot Projects"
readme = "README.md"
homepage = "https://github.com/anasnaciri/spg"
repository = "https://github.com/anasnaciri/spg"
license = "MIT OR Apache-2.0"
keywords = ["spring", "spring-boot", "initializr", "scaffold", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "/.githooks",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/Prompt.md",
    "/todo.md",
    "/init",
]

[lib]
name = "spg"

[[bin]]
name = "spg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.25"
directories = "6"
inquire = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
zip = "2"
